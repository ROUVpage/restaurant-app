<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Rincón - Inicio</title>
<link rel="stylesheet" href="/css/main.css">
<link rel="stylesheet" href="/css/index.css">
</head>
<body class="home-page">

  <header class="home-header">
    <div class="home-brand">El Rincón</div>
    <nav class="home-nav">
      <a href="/carta">Nuestra carta</a>
      <a href="/seguimiento">Seguimiento pedido</a>
      <a href="/reservas">Reservar mesa</a>
    </nav>
  </header>

  <main class="home-hero">
    <section class="order-widget" aria-label="Tipo de pedido">
      <div class="order-mode-toggle" role="tablist" aria-label="Modo de entrega">
        <button id="modeDeliveryBtn" class="mode-btn active" type="button" role="tab" aria-selected="true">A domicilio</button>
        <button id="modePickupBtn" class="mode-btn" type="button" role="tab" aria-selected="false">Recoger</button>
      </div>

      <div class="order-input-row">
        <input id="orderLocationInput" type="text" autocomplete="street-address" placeholder="Introduce tu direccion">
        <button id="startOrderBtn" type="button">Haz tu pedido</button>
      </div>
      <p id="orderHint" class="order-hint">Te llevamos el pedido a la direccion indicada.</p>
    </section>
  </main>

  <script src="/js/i18n.js?v=20260904"></script>
  <script src="/js/index.js"></script>
</body>
</html>
