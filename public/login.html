<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceso — Panel de Gestión</title>
<link rel="stylesheet" href="/css/main.css">
<link rel="stylesheet" href="/css/login.css">
</head>
<body class="login-page">
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-logo">
        <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
          <circle cx="24" cy="24" r="24" fill="#c9a84c" fill-opacity="0.12"/>
          <path d="M14 18c0-1.1.9-2 2-2h16a2 2 0 0 1 2 2v2a8 8 0 0 1-8 8h-4a8 8 0 0 1-8-8v-2Z" stroke="#c9a84c" stroke-width="1.5"/>
          <path d="M24 28v6M20 34h8" stroke="#c9a84c" stroke-width="1.5" stroke-linecap="round"/>
          <circle cx="19" cy="12" r="1.5" fill="#c9a84c"/>
          <circle cx="24" cy="10" r="1.5" fill="#c9a84c"/>
          <circle cx="29" cy="12" r="1.5" fill="#c9a84c"/>
        </svg>
        <h1>Panel de Gestión</h1>
        <p>Acceso privado para personal</p>
      </div>
      <form id="loginForm" class="login-form" autocomplete="off">
        <div class="form-group">
          <label for="username">Usuario</label>
          <input type="text" id="username" name="username" placeholder="admin" autocomplete="username">
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" placeholder="••••••" autocomplete="current-password">
        </div>
        <div id="loginError" class="error-msg hidden">Credenciales incorrectas</div>
        <button type="submit" class="btn-primary btn-full">Iniciar Sesión</button>
      </form>
    </div>
  </div>
  <script src="/js/i18n.js?v=20260904"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
