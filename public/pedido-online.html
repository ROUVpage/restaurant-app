<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedido online</title>
<link rel="stylesheet" href="/css/main.css">
<link rel="stylesheet" href="/css/mesa.css">
<link rel="stylesheet" href="/css/pedido.css">
<link rel="stylesheet" href="/css/pedido-online.css">
</head>
<body class="mesa-page pedido-page pedido-online-page">

  <header class="mesa-header">
    <div class="header-brand">
      <button class="btn-back" id="backBtn" aria-label="Volver">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M19 12H5M12 5l-7 7 7 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <svg width="28" height="28" viewBox="0 0 48 48" fill="none">
        <path d="M14 18c0-1.1.9-2 2-2h16a2 2 0 0 1 2 2v2a8 8 0 0 1-8 8h-4a8 8 0 0 1-8-8v-2Z" stroke="#c9a84c" stroke-width="1.5"/>
        <path d="M24 28v6M20 34h8" stroke="#c9a84c" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="19" cy="12" r="1.5" fill="#c9a84c"/>
        <circle cx="24" cy="10" r="1.5" fill="#c9a84c"/>
        <circle cx="29" cy="12" r="1.5" fill="#c9a84c"/>
      </svg>
      <div>
        <span class="brand-name">El Rincón</span>
        <span class="mesa-label">Pedido online</span>
      </div>
    </div>
    <div class="header-actions">
      <span class="mesa-label" id="modePill">A domicilio</span>
    </div>
  </header>

  <section class="online-context" id="onlineContextLine"></section>

  <nav class="category-nav" id="categoryNav">
    <button class="cat-btn active" data-cat="tapas">Tapas</button>
    <button class="cat-btn" data-cat="raciones">Raciones</button>
    <button class="cat-btn" data-cat="bebidas">Bebidas</button>
    <button class="cat-btn" data-cat="postres">Postres</button>
  </nav>

  <main class="products-area" id="productsArea">
    <section class="products-section" id="tapas">
      <h2 class="section-title">Tapas</h2>
      <div class="products-grid" id="grid-tapas"></div>
    </section>
    <section class="products-section" id="raciones">
      <h2 class="section-title">Raciones</h2>
      <div class="products-grid" id="grid-raciones"></div>
    </section>
    <section class="products-section" id="bebidas">
      <h2 class="section-title">Bebidas</h2>
      <div class="products-grid" id="grid-bebidas"></div>
    </section>
    <section class="products-section" id="postres">
      <h2 class="section-title">Postres</h2>
      <div class="products-grid" id="grid-postres"></div>
    </section>
  </main>

  <footer class="mesa-footer">
    <div class="footer-actions keep-row-mobile keep-row-mobile-2 online-footer-actions">
      <button class="footer-btn btn-outline has-total" id="viewOrderBtn">
        <span>Ver pedido</span>
        <span class="footer-btn-total" id="cartCount">0</span>
      </button>
      <button class="footer-btn btn-gold has-total" id="finalizeFromMenuBtn" disabled>
        <span>Finalizar pedido</span>
        <span class="pedido-total" id="finalizeTotal">0,00 €</span>
      </button>
    </div>
  </footer>

  <script src="/js/utils.js"></script>
  <script src="/js/online-cart.js"></script>
  <script src="/js/pedido-online.js"></script>
</body>
</html>
